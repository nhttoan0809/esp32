<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Login | Smart Lamp Voice Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #f1f5f9;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --card-shadow: 0 20px 40px rgba(0, 0, 0, 0.06), 0 1px 3px rgba(0, 0, 0, 0.04);
      --primary: #f59e0b;
      --primary-hover: #d97706;
      --primary-glow: rgba(245, 158, 11, 0.25);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --input-bg: #f8fafc;
      --input-border: #cbd5e1;
      --error-bg: #fee2e2;
      --error-border: #fca5a5;
      --error-text: #991b1b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg-base);
      background-image: 
        radial-gradient(at 0% 0%, rgba(245, 158, 11, 0.1) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.06) 0px, transparent 50%),
        radial-gradient(at 50% 50%, #f8fafc 0px, transparent 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      color: var(--text-main);
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 36px 28px;
      box-shadow: var(--card-shadow);
      position: relative;
      overflow: hidden;
      animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .login-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #f59e0b, #fbbf24, #3b82f6);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo-icon {
      width: 60px;
      height: 60px;
      margin: 0 auto 14px;
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.25);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(245, 158, 11, 0.15);
    }

    .logo-icon svg {
      width: 32px;
      height: 32px;
      fill: none;
      stroke: #d97706;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .brand h1 {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    .brand p {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 0.88rem;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .form-input {
      width: 100%;
      height: 50px;
      background: var(--input-bg);
      border: 1.5px solid var(--input-border);
      border-radius: 12px;
      padding: 0 46px 0 16px;
      color: var(--text-main);
      font-size: 16px;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.18);
      background: #ffffff;
    }

    .toggle-password {
      position: absolute;
      right: 8px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-submit {
      width: 100%;
      height: 50px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 6px 18px var(--primary-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-submit:hover:not(:disabled) {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    .alert {
      display: none;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      margin-bottom: 18px;
      align-items: center;
      gap: 10px;
    }

    .alert.error {
      display: flex;
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      color: var(--error-text);
    }

    .footer {
      margin-top: 24px;
      text-align: center;
      font-size: 0.78rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="brand">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24">
          <path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-7 7c0 2.38 1.19 4.47 3 5.74V17a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.26c1.81-1.27 3-3.36 3-5.74a7 7 0 0 0-7-7z"/>
        </svg>
      </div>
      <h1>Smart Lamp Dashboard</h1>
      <p>Enter your Dashboard API Key to authenticate</p>
    </div>

    <div id="errorAlert" class="alert error" role="alert">
      <span id="errorMessage">Invalid Dashboard API Key</span>
    </div>

    <form id="loginForm" autocomplete="off">
      <div class="form-group">
        <label class="form-label" for="apiKeyInput">Dashboard API Key</label>
        <div class="input-wrapper">
          <input 
            id="apiKeyInput" 
            class="form-input" 
            type="password" 
            placeholder="Enter API key..." 
            required 
            autofocus 
          />
        </div>
      </div>

      <button type="submit" id="submitBtn" class="btn-submit">
        <span id="btnText">Enter Dashboard</span>
      </button>
    </form>

    <div class="footer">
      ESP32 Smart Lamp Controller &bull; Voice Wake-Up Hub
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'lamp_dashboard_api_key';
    const form = document.getElementById('loginForm');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const errorAlert = document.getElementById('errorAlert');
    const errorMessage = document.getElementById('errorMessage');

    window.addEventListener('DOMContentLoaded', async () => {
      const savedKey = localStorage.getItem(STORAGE_KEY);
      if (savedKey) {
        apiKeyInput.value = savedKey;
        await verifyAndLogin(savedKey, true);
      }
    });

    async function verifyAndLogin(key, silent = false) {
      if (!silent) {
        submitBtn.disabled = true;
        btnText.textContent = 'Authenticating...';
        errorAlert.classList.remove('error');
      }

      try {
        const response = await fetch('/api/auth/verify', {
          method: 'POST',
          headers: {
            'X-API-Key': key,
            'Content-Type': 'application/json'
          }
        });

        if (response.ok) {
          localStorage.setItem(STORAGE_KEY, key);
          window.location.href = '/dashboard';
          return;
        }

        localStorage.removeItem(STORAGE_KEY);
        showError('Invalid API Key. Please check your credentials.');
      } catch (err) {
        if (!silent) {
          showError('Unable to reach server. Please check connection.');
        }
      } finally {
        submitBtn.disabled = false;
        btnText.textContent = 'Enter Dashboard';
      }
    }

    function showError(msg) {
      errorMessage.textContent = msg;
      errorAlert.classList.add('error');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const key = apiKeyInput.value.trim();
      if (!key) return;
      await verifyAndLogin(key);
    });
  </script>
</body>
</html>
