[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  adafruit/DHT sensor library@^1.4.6
  adafruit/Adafruit Unified Sensor@^1.1.14
  knolleary/PubSubClient@^2.8
build_flags =
  -DCORE_DEBUG_LEVEL=1

[env:wokwi]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  adafruit/DHT sensor library@^1.4.6
  adafruit/Adafruit Unified Sensor@^1.1.14
  knolleary/PubSubClient@^2.8
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DWOKWI_SIMULATION
