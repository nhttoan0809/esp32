<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dashboard | ESP32 Cloud Controller</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #f1f5f9;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --card-hover-border: #93c5fd;
      --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.05), 0 1px 3px rgba(0, 0, 0, 0.03);
      --primary: #007aff;
      --primary-hover: #0062cc;
      --success: #10b981;
      --success-glow: rgba(16, 185, 129, 0.3);
      --offline: #94a3b8;
      --danger: #ef4444;
      --warning: #f59e0b;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --input-bg: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg-base);
      background-image: 
        radial-gradient(at 0% 0%, rgba(0, 122, 255, 0.07) 0px, transparent 45%),
        radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.05) 0px, transparent 45%),
        radial-gradient(at 50% 50%, #f8fafc 0px, transparent 100%);
      color: var(--text-main);
      padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .app-container {
      width: 100%;
      max-width: 860px;
    }

    /* Header Nav */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      margin-bottom: 24px;
      box-shadow: var(--card-shadow);
      gap: 12px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      background: rgba(0, 122, 255, 0.08);
      border: 1px solid rgba(0, 122, 255, 0.2);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
    }

    .brand-icon svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      stroke-width: 2.2;
      fill: none;
    }

    .brand-text {
      min-width: 0;
    }

    .brand-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-subtitle {
      font-size: 0.76rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn-action {
      background: #f8fafc;
      border: 1px solid var(--card-border);
      color: #1e293b;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      touch-action: manipulation;
    }

    .btn-action:hover,
    .btn-action:active {
      background: #f1f5f9;
      border-color: #cbd5e1;
    }

    .btn-logout {
      color: #dc2626;
      border-color: rgba(239, 68, 68, 0.25);
      background: rgba(239, 68, 68, 0.06);
    }

    .btn-logout:hover,
    .btn-logout:active {
      background: rgba(239, 68, 68, 0.12);
      border-color: rgba(239, 68, 68, 0.4);
    }

    /* Status Bar */
    .dashboard-status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding: 0 4px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .section-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .sync-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .sync-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 6px var(--success);
      animation: pulseSync 2s infinite ease-in-out;
    }

    @keyframes pulseSync {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.6; }
    }

    /* Device Grid */
    .device-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 16px;
    }

    /* Device Card */
    .device-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 22px;
      box-shadow: var(--card-shadow);
      position: relative;
      overflow: hidden;
      transition: all 0.25s ease;
    }

    .device-card:hover {
      border-color: var(--card-hover-border);
    }

    .device-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      gap: 10px;
    }

    .device-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .chip-avatar {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 122, 255, 0.08);
      border: 1px solid rgba(0, 122, 255, 0.2);
      color: var(--primary);
    }

    .chip-avatar svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
    }

    .device-name {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .device-type {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    /* Online / Offline Status Badge */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 11px;
      border-radius: 30px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      flex-shrink: 0;
    }

    .status-badge.online {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.25);
      color: #059669;
    }

    .status-badge.online .badge-dot {
      background: var(--success);
      box-shadow: 0 0 6px var(--success);
      animation: pulseOnline 1.8s infinite;
    }

    .status-badge.offline {
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      color: #64748b;
    }

    .status-badge.offline .badge-dot {
      background: var(--offline);
      box-shadow: none;
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }

    @keyframes pulseOnline {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.25); }
    }

    /* Main Relay Controller Box */
    .relay-control-box {
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 14px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      gap: 12px;
    }

    .relay-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .relay-title {
      font-size: 0.94rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .relay-pin {
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 6px;
      background: rgba(239, 68, 68, 0.1);
      color: #dc2626;
      font-weight: 800;
    }

    .relay-state-label {
      font-size: 0.84rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .state-indicator-text {
      font-weight: 700;
    }

    .state-indicator-text.on {
      color: #16a34a;
    }

    .state-indicator-text.off {
      color: #64748b;
    }

    /* iOS-like Toggle Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 56px;
      height: 32px;
      flex-shrink: 0;
      touch-action: manipulation;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #cbd5e1;
      transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 34px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 24px;
      width: 24px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 50%;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
    }

    input:checked + .slider {
      background: #10b981;
      box-shadow: 0 0 12px var(--success-glow);
    }

    input:checked + .slider:before {
      transform: translateX(24px);
    }

    input:disabled + .slider {
      opacity: 0.5;
      cursor: wait;
    }

    /* Warning / Queued Alert */
    .queued-alert {
      display: none;
      background: #fef3c7;
      border: 1px solid #fde68a;
      color: #92400e;
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 0.8rem;
      margin-bottom: 14px;
      align-items: center;
      gap: 8px;
      line-height: 1.35;
    }

    .queued-alert.show {
      display: flex;
    }

    /* Diagnostics / Telemetry Info */
    .telemetry-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .telemetry-item {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 8px 12px;
      min-width: 0;
    }

    .telemetry-label {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 3px;
    }

    .telemetry-value {
      font-size: 0.82rem;
      font-weight: 700;
      color: #1e293b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Empty state / Loading */
    .empty-card {
      text-align: center;
      padding: 40px 20px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* Mobile Media Queries */
    @media (max-width: 600px) {
      body {
        padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      }

      header {
        padding: 12px 14px;
        border-radius: 16px;
        margin-bottom: 18px;
      }

      .brand-title {
        font-size: 1rem;
      }

      .brand-subtitle {
        font-size: 0.72rem;
      }

      .btn-action {
        padding: 7px 10px;
        font-size: 0.78rem;
      }

      .btn-action span.btn-label {
        display: none;
      }

      .device-grid {
        grid-template-columns: 1fr;
      }

      .device-card {
        padding: 16px 14px;
        border-radius: 16px;
      }

      .relay-control-box {
        padding: 12px 14px;
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header>
      <div class="brand-group">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
          </svg>
        </div>
        <div class="brand-text">
          <div class="brand-title">ESP32 Cloud Controller</div>
          <div class="brand-subtitle">WebSocket Control Hub</div>
        </div>
      </div>

      <div class="nav-actions">
        <button id="refreshBtn" class="btn-action" title="Tải lại trạng thái">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
          </svg>
          <span class="btn-label">Làm mới</span>
        </button>
        <button id="logoutBtn" class="btn-action btn-logout" title="Đăng xuất">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          <span class="btn-label">Đăng xuất</span>
        </button>
      </div>
    </header>

    <!-- Status Bar -->
    <div class="dashboard-status-bar">
      <div class="section-title">Thiết bị kết nối</div>
      <div class="sync-indicator">
        <span class="sync-dot"></span>
        <span>Auto Sync (3s)</span>
      </div>
    </div>

    <!-- Device List Container -->
    <div class="device-grid" id="deviceGrid">
      <div class="empty-card">Đang kết nối và tải dữ liệu thiết bị...</div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'poc5_dashboard_api_key';
    const apiKey = localStorage.getItem(STORAGE_KEY);

    // Auth Guard: Redirect if not logged in
    if (!apiKey) {
      window.location.href = '/login';
    }

    const deviceGrid = document.getElementById('deviceGrid');
    const refreshBtn = document.getElementById('refreshBtn');
    const logoutBtn = document.getElementById('logoutBtn');

    let isOperating = false;

    // Logout Action
    logoutBtn.addEventListener('click', () => {
      localStorage.removeItem(STORAGE_KEY);
      window.location.href = '/login';
    });

    function headers() {
      return {
        'Content-Type': 'application/json',
        'X-API-Key': apiKey,
      };
    }

    function formatTime(isoString) {
      if (!isoString) return 'Chưa có';
      try {
        const date = new Date(isoString);
        return date.toLocaleTimeString('vi-VN', { hour12: false }) + ' ' + date.toLocaleDateString('vi-VN');
      } catch {
        return isoString;
      }
    }

    async function fetchDevices() {
      try {
        const res = await fetch('/api/devices', { headers: headers() });
        if (res.status === 401) {
          localStorage.removeItem(STORAGE_KEY);
          window.location.href = '/login';
          return;
        }
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const devices = await res.json();
        renderDevices(devices);
      } catch (err) {
        console.error('Fetch devices error:', err);
      }
    }

    function renderDevices(devices) {
      if (isOperating) return;

      if (!devices || devices.length === 0) {
        deviceGrid.innerHTML = `
          <div class="empty-card">
            Chưa có thiết bị ESP32 nào được đăng ký trên hệ thống.
          </div>
        `;
        return;
      }

      deviceGrid.innerHTML = devices.map(device => {
        const isOnline = device.online === true;
        const isRelayOn = device.on === true;
        const hasPending = device.pending_on !== null && device.pending_on !== undefined;

        return `
          <div class="device-card" id="card-${device.device_id}">
            <div class="device-card-header">
              <div class="device-meta">
                <div class="chip-avatar">
                  <svg viewBox="0 0 24 24">
                    <rect x="4" y="4" width="16" height="16" rx="2"></rect>
                    <rect x="9" y="9" width="6" height="6"></rect>
                    <line x1="9" y1="1" x2="9" y2="4"></line>
                    <line x1="15" y1="1" x2="15" y2="4"></line>
                    <line x1="9" y1="20" x2="9" y2="23"></line>
                    <line x1="15" y1="20" x2="15" y2="23"></line>
                    <line x1="20" y1="9" x2="23" y2="9"></line>
                    <line x1="20" y1="14" x2="23" y2="14"></line>
                    <line x1="1" y1="9" x2="4" y2="9"></line>
                    <line x1="1" y1="14" x2="4" y2="14"></line>
                  </svg>
                </div>
                <div>
                  <div class="device-name">${device.device_id}</div>
                  <div class="device-type">ESP32 DevKit V1</div>
                </div>
              </div>

              <div class="status-badge ${isOnline ? 'online' : 'offline'}">
                <span class="badge-dot"></span>
                <span>${isOnline ? 'ONLINE' : 'OFFLINE'}</span>
              </div>
            </div>

            <!-- Relay Controller -->
            <div class="relay-control-box">
              <div class="relay-info">
                <div class="relay-title">
                  Real_Device
                  <span class="relay-pin">GPIO 23</span>
                </div>
                <div class="relay-state-label">
                  Trạng thái: 
                  <span class="state-indicator-text ${isRelayOn ? 'on' : 'off'}">
                    ${isRelayOn ? 'BẬT (ON)' : 'TẮT (OFF)'}
                  </span>
                </div>
              </div>

              <label class="switch">
                <input 
                  type="checkbox" 
                  id="toggle-${device.device_id}" 
                  ${isRelayOn ? 'checked' : ''} 
                  onchange="handleToggle('${device.device_id}', this.checked)"
                >
                <span class="slider"></span>
              </label>
            </div>

            <!-- Queued Alert if offline command stored -->
            <div class="queued-alert ${hasPending ? 'show' : ''}">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
              </svg>
              <span>Lệnh ${device.pending_on ? 'BẬT' : 'TẮT'} đang lưu trong hàng đợi (sẽ tự chạy khi online).</span>
            </div>

            <!-- Telemetry & Info -->
            <div class="telemetry-list">
              <div class="telemetry-item">
                <div class="telemetry-label">Hoạt động gần nhất</div>
                <div class="telemetry-value">${formatTime(device.last_seen)}</div>
              </div>
              <div class="telemetry-item">
                <div class="telemetry-label">Đồng bộ Cloud</div>
                <div class="telemetry-value" style="color: ${isOnline ? '#059669' : '#64748b'}">
                  ${isOnline ? 'WSS Live' : 'Chờ kết nối'}
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    async function handleToggle(deviceId, targetState) {
      isOperating = true;
      const toggleInput = document.getElementById(`toggle-${deviceId}`);
      if (toggleInput) toggleInput.disabled = true;

      try {
        const response = await fetch(`/api/devices/${encodeURIComponent(deviceId)}/state`, {
          method: 'PUT',
          headers: headers(),
          body: JSON.stringify({ on: targetState })
        });

        if (response.status === 401) {
          localStorage.removeItem(STORAGE_KEY);
          window.location.href = '/login';
          return;
        }

        const data = await response.json();
        await fetchDevices();
      } catch (err) {
        console.error('Failed to change state:', err);
        alert('Lỗi gửi lệnh điều khiển đến ESP32: ' + err.message);
        await fetchDevices();
      } finally {
        isOperating = false;
        if (toggleInput) toggleInput.disabled = false;
      }
    }

    refreshBtn.addEventListener('click', fetchDevices);

    // Initial load
    fetchDevices();

    // Auto sync interval (3 seconds)
    setInterval(fetchDevices, 3000);
  </script>
</body>
</html>
